name: CI

on:
  push:
    branches: ["mc/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        shell: pwsh
        run: .\test.ps1

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v7
        with:
          name: level10-enchantments
          path: |
            build/dist/*.jar
          if-no-files-found: error
