plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archive_base_name}-${project.minecraft_version}"
}

loom {
	mods {
		"level10enchantments" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftVersion", project.minecraft_version
	inputs.property "fabricApiVersion", project.fabric_api_version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

def pureLogicTests = [
		"EnchantingLevelPolicyTest",
		"AnvilLevelMergePolicyTest",
		"LootBalancePolicyTest",
		"MasterLibrarianTradePolicyTest",
		"CompatibilitySurchargeTest",
		"AnvilCostPolicyTest",
		"RainbowColorsTest",
		"LegacyEffectPolicyTest",
		"LegacyMaxLevelTargetTest"
]

def pureLogicTasks = pureLogicTests.collect { testName ->
	tasks.register("run${testName}", JavaExec) {
		dependsOn tasks.named("testClasses")
		classpath = sourceSets.test.runtimeClasspath
		mainClass = "com.liy.level10enchantments.${testName}"
	}
}

tasks.register("pureLogicTest") {
	group = "verification"
	description = "Runs the standalone gameplay-policy regression tests."
	dependsOn pureLogicTasks
}

tasks.named("check") {
	dependsOn tasks.named("pureLogicTest")
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
	from("COPYING")
	from("COPYING.LESSER")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
